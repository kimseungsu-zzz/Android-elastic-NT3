name: Elastic NT3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: write

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --concurrency=1

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            output: build/windows/x64/runner/Release
            artifact: Elastic-NT3-Windows
          - name: macOS
            os: macos-latest
            platform: macos
            output: build/macos/Build/Products/Release
            artifact: Elastic-NT3-macOS
          - name: Linux
            os: ubuntu-22.04
            platform: linux
            output: build/linux/x64/release/bundle
            artifact: Elastic-NT3-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa ninja-build libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ${{ matrix.platform }} --release
      - name: Copy Windows runtime files
        if: matrix.platform == 'windows'
        run: ./.github/CopyRuntime.ps1 -OutputPath ${{ matrix.output }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package artifacts
        run: |
          cd artifacts
          for directory in Elastic-NT3-*; do
            zip -r "${directory}.zip" "${directory}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
